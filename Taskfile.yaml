version: "3"

vars:
  ADDR: '{{.HAREL_HTTP_ADDR | default "127.0.0.1:18431"}}'
  TAG: '{{.PLUGIN | default "telegram"}}'

tasks:
  build:
    cmd: go build -tags {{.TAG}} -o /tmp/harel-bin .

  wasm:
    env:
      GOOS: wasip1
      GOARCH: wasm
    cmd: go build -tags {{.TAG}} -o harel.wasm .

  vet:
    cmds:
      - go vet -tags telegram ./...
      - go vet -tags http ./...

  secrets:
    cmd: /usr/local/bin/hermes-ssm-env > .env

  run:
    deps:
      - build
    cmd: source <(/usr/local/bin/hermes-ssm-env | sed 's/^/export /') && HAREL_HTTP_ADDR={{.ADDR}} /tmp/harel-bin

  test:
    vars:
      JSON_CONTENT_HEADER: "Content-Type: application/json"
      JSON_DATA: '{"text":"Say exactly: harel works. On a new line write MEMORY: test ran."}'
    cmd: curl -s -X POST http://{{.ADDR}}/message -H {{.JSON_CONTENT_HEADER}} --data {{.JSON_DATA}}

  vacuum:
    cmd: go run ./cmd/vacuum

  wasm-tinygo:
    cmd: GOFIPS140=off /usr/local/tinygo/bin/tinygo build -tags tinygo,no_openssl -target=wasip1 -o harel-tinygo.wasm .

  wasmtime:
    cmd: wasmtime run --dir {{.WASMDIR | default "/tmp"}}::/harel-state --env XDG_STATE_HOME=/harel-state --env HOME=/harel-state harel-tinygo.wasm
