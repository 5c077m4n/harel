version: "3"

vars:
  ADDR: '{{.HAREL_HTTP_ADDR | default "127.0.0.1:18431"}}'
  TAG: '{{.PLUGIN | default "telegram"}}'

tasks:
  build:
    cmds:
      - go build -tags {{.TAG}} -o /tmp/harel-bin .

  wasm:
    cmds:
      - GOOS=wasip1 GOARCH=wasm go build -tags {{.TAG}} -o harel.wasm .

  vet:
    cmds:
      - go vet -tags telegram ./...
      - go vet -tags http ./...

  secrets:
    cmds:
      - /usr/local/bin/hermes-ssm-env > .env

  run:
    deps: [build]
    cmds:
      - "source <(/usr/local/bin/hermes-ssm-env | sed 's/^/export /') && HAREL_HTTP_ADDR={{.ADDR}} /tmp/harel-bin"

  test:
    cmds:
      - "curl -s -X POST http://{{.ADDR}}/message -H 'Content-Type: application/json' --data '{\"text\":\"Say exactly: harel works. On a new line write MEMORY: test ran.\"}'"

  vacuum:
    cmds:
      - go run ./cmd/vacuum

  wasm-tinygo:
    cmds:
      - GOFIPS140=off /usr/local/tinygo/bin/tinygo build -tags tinygo,no_openssl -target=wasip1 -o harel-tinygo.wasm .

  wasmtime:
    cmds:
      - "wasmtime run --dir {{.WASMDIR | default \"/tmp\"}}::/harel-state --env XDG_STATE_HOME=/harel-state --env HOME=/harel-state harel-tinygo.wasm"
